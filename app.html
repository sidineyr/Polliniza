<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>Polliniza</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="logo" aria-hidden="true">?</span><div><strong>Polliniza</strong><small>Crie uma vez. Publique com controle.</small></div></div><button id="newPoll" class="ghost">Nova enquete</button></header>
  <main class="layout">
    <section class="panel editor" aria-labelledby="create-title">
      <p class="eyebrow">Estúdio de enquetes</p><h1 id="create-title">Qual pergunta merece viajar?</h1>
      <label for="instruction">Instrução simples</label>
      <textarea id="instruction" rows="3" placeholder="Ex.: Pergunte qual projeto educacional desperta mais curiosidade: Horizonte, QV, Chemical ou Einstein Física."></textarea>
      <button id="interpret" class="secondary">Transformar em enquete</button>
      <div class="divider"><span>revise os detalhes</span></div>
      <label for="question">Pergunta</label><input id="question" maxlength="300" placeholder="O que você quer descobrir?"><small id="questionCount" class="counter">0/300</small>
      <fieldset><legend>Opções</legend><div id="options"></div><button id="addOption" class="ghost" type="button">+ Adicionar opção</button></fieldset>
      <label for="caption">Legenda</label><textarea id="caption" rows="3" maxlength="1000" placeholder="Um convite breve para participar"></textarea>
      <div class="row"><label>Duração <select id="duration"><option value="1">1 dia</option><option value="3">3 dias</option><option value="7" selected>7 dias</option><option value="14">14 dias</option></select></label><label>Hashtags <input id="hashtags" placeholder="#educação #tecnologia"></label></div>
      <fieldset><legend>Redes</legend><div id="networks" class="network-grid"></div></fieldset>
      <div class="actions"><button id="save" class="secondary">Salvar rascunho</button><button id="prepare" class="primary">Preparar publicação</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <aside class="panel preview" aria-labelledby="preview-title"><p class="eyebrow">Prévia por rede</p><h2 id="preview-title">Antes de publicar, confira tudo.</h2><div id="previews" class="cards"><p class="empty">Selecione redes e prepare a publicação.</p></div></aside>
  </main>
  <template id="optionTemplate"><div class="option-row"><input class="option-input" maxlength="80" aria-label="Opção da enquete"><button class="remove" type="button" aria-label="Remover opção">×</button></div></template>
  <script type="module" src="app.js"></script>
</body>
</html>
